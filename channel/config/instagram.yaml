# Instagram 채널 운영 설정 (플랫폼 제약 + 출력 규칙)

channel:
  id: "instagram"
  handle: "your_handle"
  # Phase 2: quality gate → 사람 승인. 자동 게시는 하지 않습니다.
  phase: 2
  publish: false

# Phase 3 publisher는 구현되어도 이 설정과 승인 목표가 모두 충족되기 전에는
# 네트워크 호출을 하지 않습니다. Meta가 로컬 파일을 가져갈 수 없고 이미지
# publishing은 JPEG URL을 요구하므로, 별도 media manifest가 필요합니다.
publishing:
  # 무인 실행에서 승인된 후보를 자동 게시(channel/src/autopublish.py). **최후 스위치**: 이것과
  # channel.phase=3 + channel.publish=true 가 모두 켜져야 실제로 게시된다. 끄면 승인까지만 하고 알린다.
  # 즉시 중지: `touch logs/PAUSE_PUBLISHING` (파일이 있는 동안 게시하지 않음).
  auto_publish: false
  max_posts_per_day: 1
  # 장기 토큰(약 60일)을 무인 실행 중에 갱신한다(channel/src/token_store.py). 갱신본은 ~/.r_a_glance 에 두고
  # .env 는 건드리지 않는다. 갱신에 실패했거나 만료가 warn_days 안이면 알린다.
  token_refresh:
    enabled: true
    refresh_every_days: 7
    warn_days: 14
    assumed_lifetime_days: 60
  api_base: "https://graph.instagram.com"
  api_version: "v25.0"
  timeout_seconds: 30
  container_poll_attempts: 10
  container_poll_interval_seconds: 2
  # 소유자 결정(2026-10-28): "연속 10회 무수정 승인" 조건은 폐기했다(자동 게이트가 대신함, HANDOFF 26).
  require_phase3_ready: true
  # 승인 뒤 이 일수가 지나면 게시하지 않습니다(소식의 시점이 지났을 수 있음).
  max_approval_age_days: 3
  # PNG → JPEG 변환과 정적 호스팅 준비 (python -m channel.src.media prepare).
  # base_url 은 비밀이 아닌 공개 주소이며, 호스팅이 준비되면 채웁니다.
  media:
    base_url: "https://YOUR-USER.github.io/YOUR-MEDIA-REPO"
    stage_dir: "media_site"
    jpeg_quality: 92
    # push 뒤 GitHub Pages 빌드를 기다리는 폴링 (30회 x 10초 = 최대 5분)
    wait_attempts: 30
    wait_interval_seconds: 10

posting:
  # 주 2회 게시: 월요일에 엔진이 이번 주 소식을 모으고(주제 2개 선정), 수·일에 하나씩 만들어 올린다.
  # 실제 일정은 scripts/*.plist (엔진 월 08:30, 채널 수·일 08:30).
  days: [wednesday, sunday]
  time_local: "08:30"
  timezone: "Asia/Seoul"
  posts_per_run: 1
  # 승인되지 못한 후보(BLOCK·자동 게이트 보류)가 나오면 같은 실행에서 다음 토픽을 시도하는 최대 횟수(LLM 비용 상한).
  max_attempts: 3
  # 이 일수 안에 후보(승인·보류·거절 모두)가 있는 토픽은 무인 실행에서 다시 만들지 않는다.
  dedupe_days: 14
  # 무인 실행이 쓰는 research.json 의 최대 나이(일). 월요일 엔진 실행이 실패해 낡은 소식을 올리는 것을 막는다.
  max_research_age_days: 8

carousel:
  # 허용 slide 수. 이 외의 값은 validator 가 BLOCK 합니다.
  allowed_slide_counts: [3, 5, 7]
  default_template: "news_standard"
  max_slides_per_post: 7

caption:
  max_chars: 2200          # Instagram 하드 제한
  target_chars: 900        # 실제 목표 길이
  min_sentences: 3
  max_sentences: 5
  hashtags:
    min: 3
    max: 6
    # 항상 포함되는 기본 태그(카테고리에 따라 하나 선택)
    base:
      ai: "#AI"
      blockchain: "#Blockchain"
      security: "#Security"
      policy: "#Policy"
      science: "#Science"
      health: "#Health"
  # URL 은 캡션 본문에 넣지 않고 metadata 로만 유지합니다.
  include_urls_in_body: false

sources:
  # slide 에는 기관명만, URL 은 carousel.json / caption metadata 에만.
  show_urls_on_slide: false
  max_shown: 3

output:
  # 검수·승인 대상 산출물 위치(채널 루트 기준 상대경로 → 프로젝트 최상단 For_Review/).
  dir: "../For_Review"
  files:
    carousel_json: "carousel.json"
    caption_md: "caption.md"
    review_md: "review.md"
    preview_html: "preview.html"
    slides_dir: "slides"
  slide_filename_format: "{index:02d}.png"

renderer:
  # playwright 가 설치되어 있으면 우선 사용하고, 없으면 headless Chrome CLI 를 씁니다.
  backend_priority: ["playwright", "chrome_cli"]
  chrome_candidates:
    - "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    - "/Applications/Chromium.app/Contents/MacOS/Chromium"
    - "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"
  timeout_seconds: 60
  # 렌더 후 PNG 크기가 캔버스와 다르면 실패 처리
  verify_png_size: true

quality_gate:
  # BLOCK 이 하나라도 있으면 publishable = false
  block:
    - slide_count_not_allowed
    - missing_headline
    - missing_source
    - missing_caption
    - missing_slide_image
    - renderer_failure
    - text_overflow
    - unresolved_critical_fact
    - internal_language_leak
    - thin_slide_after_repair
    - insufficient_unique_material
    - llm_recovery_failed
    - thin_slide_unresolved
    - duplicate_unresolved
    - cover_rewrite_failed
    - unsupported_claim
    - grounding_unchecked
    - stale_deadline
  warn:
    - headline_too_long
    - slide_too_dense
    - partially_verified
    - single_source
    - caption_too_long
    - cover_body_semantic_duplicate
    - partial_claim_support
    - grounding_stale

# public output 에 새어 나가면 안 되는 내부 표현. validator 가 검사합니다.
internal_language_markers:
  - "확인 필요"
  - "검증 필요"
  - "source truncated"
  - "소스에서 잘"
  - "LLM output"
  - "metadata missing"
  - "fact check needed"
  - "parsing failed"
  - "TODO"
  - "TBD"

# 무인 실행 결과 알림(logs/channel_alerts.log + macOS 배너): 승인·게시 완료·승인된 후보 없음·게시 실패.
notify:
  enabled: true
  banner: true
  # 휴대폰 알림(텔레그램 전용 봇, channel/src/telegram_notify.py). RAG_TELEGRAM_BOT_TOKEN·RAG_TELEGRAM_CHAT_ID 가
  # .env 에 있을 때만 실제로 보낸다. cover_photo: 게시 완료 알림에 표지 사진을 붙인다.
  telegram:
    enabled: true
    cover_photo: true

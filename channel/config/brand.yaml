# R_A_Glance 브랜드 설정 (단일 진실 공급원)
#
# 색상·캔버스·타이포그래피를 여기서만 관리합니다. renderer 와 템플릿 CSS 는 이 값을
# CSS 변수로 주입받습니다. 코드에 색상/사이즈를 하드코딩하지 않습니다.

brand:
  name: "R_A_Glance"
  # 캐러셀 하단에 표기되는 워드마크
  wordmark: "R_A_Glance"
  meaning: "RAG + Glance — 맥락을 쌓아 한눈에 보여준다"
  tagline: "바뀐 것만, 한눈에"

# 바탕·글자 2색 + 카테고리별 포인트 컬러 1색(2026-10-27 추가: 흑백만으로는 피드에서
# 눈에 띄지 않는다는 검수 의견). 포인트 컬러는 강조선·eyebrow·진행바·차트 강조에만 쓰고
# 본문 글자색으로는 쓰지 않습니다.
colors:
  background: "#0D0D0D"
  foreground: "#F5F5F5"
  # renderer 가 carousel.topic(소문자)으로 고릅니다. 없으면 default(흰색 = 기타).
  # 6색은 서로 구분되도록 골랐다(Lab ΔE 최소 48 — tests/test_categories.py 가 40 미만이면 실패).
  # 색은 카테고리 식별을 돕는 보조 신호이고, 카테고리 이름은 항상 eyebrow 글자로도 나온다.
  accent:
    blockchain: "#FFB020"   # 주황
    ai: "#3DDC84"           # 초록
    security: "#FF5B5B"     # 빨강 (위험 신호)
    policy: "#4C8DFF"       # 파랑 (공식·권위)
    science: "#E879F9"      # 마젠타 (우주·과학)
    health: "#22D3EE"       # 시안 (바이오·헬스)
    default: "#F5F5F5"      # 흰색 (기타)
  # 아래 두 값은 foreground 의 투명도 변형이며 새로운 색이 아닙니다.
  muted: "rgba(245, 245, 245, 0.62)"
  hairline: "rgba(245, 245, 245, 0.16)"

canvas:
  width: 1080
  height: 1350
  aspect_ratio: "4:5"
  # PNG 배율. 1 = 1080x1350
  scale: 1

layout:
  margin_x: 88
  margin_y: 88
  # 요소 사이 기본 간격
  gap: 28
  # 본문 bullet 사이 간격
  body_gap: 20
  # 제목/본문 사이 간격
  title_body_gap: 40
  # 균일성: 본문(제목)은 헤더 아래 이 간격에 고정한다. 모든 content·closing 슬라이드가 같은 y.
  main_top: 64
  # 표지 헤드라인 블록의 아래 끝을 푸터 위 이 간격에 고정한다.
  cover_bottom: 40

# 로고(모든 슬라이드 푸터 왼쪽). path 가 비어 있으면 코드로 그린 기본 로고(사각 렌즈 + 워드마크).
# 로고 파일은 channel/assets/ 에 두고 path 를 지정한다(채널 루트 기준, PNG·SVG·JPG).
#   mode: mask  — 단색(투명 배경) PNG·SVG 를 테마 글자색으로 칠한다. 어떤 배경에서도 대비 보장.
#   mode: image — 원본 색 그대로. 컬러 로고용(JPG 는 투명 배경이 없어 항상 이 방식).
#   shape: circle — 정사각 원형 배지 로고를 원으로 잘라 표시(흰 모서리 제거 + 얇은 테두리).
logo:
  path: "../logo/Basic/raglance_black.png"
  mode: mask
  height: 60

# 표지 큰 로고(카테고리별). 채널 루트 기준 PNG(투명 배경, 단색) — 표지 글자색으로 칠해 쓴다.
# 키는 colors.accent 와 같다. 없으면 default 를 쓰고, 파일이 없으면 코드로 그린 일러스트로 대체.
cover_logos:
  blockchain: "../logo/category-logos/blockchain.png"
  ai: "../logo/category-logos/ai.png"
  security: "../logo/category-logos/security.png"
  policy: "../logo/category-logos/policy.png"
  science: "../logo/category-logos/space.png"
  health: "../logo/category-logos/bio.png"
  default: "../logo/Basic/raglance_black.png"

typography:
  # 폰트 파일은 저장소에 복사하지 않습니다. 시스템에 설치된 폰트를 이름으로 참조하며,
  # 앞에서부터 사용 가능한 것이 선택됩니다. 한글은 Apple SD Gothic Neo 로 렌더됩니다.
  font_stack:
    - "Apple SD Gothic Neo"
    - "Helvetica Neue"
    - "Inter"
    - "system-ui"
    - "sans-serif"
  mono_stack:
    - "SF Mono"
    - "Menlo"
    - "monospace"

  headline:
    size: 96
    weight: 700
    line_height: 1.16
    letter_spacing: "-0.02em"
  subtitle:
    size: 38
    weight: 400
    line_height: 1.45
    letter_spacing: "-0.01em"
  title:
    size: 58
    weight: 700
    line_height: 1.25
    letter_spacing: "-0.015em"
  body:
    size: 40
    weight: 400
    line_height: 1.5
    letter_spacing: "0"
  meta:
    size: 24
    weight: 500
    line_height: 1.4
    letter_spacing: "0.08em"

# overflow 시 허용되는 축소 단계. 자동 truncate 는 하지 않습니다.
# renderer 가 이 배율을 순서대로 적용해 보고, 마지막 단계에서도 넘치면 render 실패.
autofit:
  scales: [1.0, 0.94, 0.88, 0.82]
  # 이 값 이하로는 줄이지 않습니다(가독성 하한).
  min_scale: 0.82
  # 균일성: 한 포스트의 content·closing 슬라이드는 가장 많이 줄어든 슬라이드의 배율로 모두 맞춘다
  # (슬라이드마다 글자 크기가 달라 보이는 것을 막는다). 표지는 별도.
  uniform: true

# 금지 디자인 (문서화 목적. renderer 는 애초에 이 요소를 생성하지 않습니다)
forbidden:
  - cyberpunk
  - neon
  - glow
  - gradient
  - 3d
  - illustration
  - card_ui
  - emoji_decoration

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-news-factory"
version = "0.1.0"
description = "Verified AI card-news pipeline: collect, RAG, fact-check gates, Instagram carousels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies are intentionally small so the pipeline can run on a Mac mini
# without heavyweight ML packages. Everything else is an optional extra.
dependencies = [
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# Local vector store upgrade (falls back to the built-in JSON store when absent).
rag = [
    "chromadb>=0.5.0",
]
# Local embedding model (falls back to the deterministic hashing embedder when absent).
embeddings = [
    "sentence-transformers>=3.0.0",
]
# Hosted LLM providers (not required for dry-run / mock / kiro_cli providers).
llm = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
contentops = "src.pipeline.run:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
